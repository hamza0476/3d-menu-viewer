# Local development database for Platera.
# Matches the default DATABASE_URL in .env.example:
#   postgresql://postgres:postgres@127.0.0.1:5432/app_db
# Usage: docker compose up -d   (stop: docker compose down)
services:
  db:
    image: postgres:16
    container_name: platera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - platera-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platera-db-data:
